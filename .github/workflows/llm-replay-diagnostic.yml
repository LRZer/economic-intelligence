name: Offline replay diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'src/guanlan/llm_replay.py'
      - 'scripts/diagnose_llm_business_replay.py'
      - 'tests/test_llm_replay.py'
      - '.github/workflows/llm-replay-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENABLE_PAID_AI: "0"
      AUTO_REFRESH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # official v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/baci/*
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # official v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Print read-only diagnostics (this is not an acceptance gate)
        run: python scripts/diagnose_llm_business_replay.py docs/validation/llm-business-first-run-replay.json --tool-fingerprints
